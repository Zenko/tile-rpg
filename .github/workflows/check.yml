name: Checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks (syntax, duplicate ids and names, releases)
        run: python3 scripts/check.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/run.js
      - name: Browser tests (classic DOM town, the WebGL fallback)
        run: TILE_RENDERER=dom node tests/run.js

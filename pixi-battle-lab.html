<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tile RPG PixiJS Battle Lab</title>
<!-- PixiJS BATTLE lab: a prototype of options A and B for how the battle screen could use PixiJS, before anything touches the real battle.
     Like pixi-lab.html and pixi-fx-lab.html it is a sandbox: not linked from index.html, not cached by sw.js, nothing in the game uses it.
     The cards here are plain DOM elements, exactly as in the real battle; PixiJS draws AROUND them in two layers:
       A. STAGE (behind the cards)  - a table shader: felt grain, a soft light pool under whichever side's turn it is (eased, tinted by the family
                                      that last acted), a darker crimson table for a boss fight, and a ripple that runs across the table when a hit lands.
       B. CINEMATIC (over the cards) - an attack in beats: wind-up (energy gathers on the attacker), lunge with a comet trail, hit-stop (everything
                                      freezes for a moment), a family-specific burst (grove leaves, stone shards and dust, tide rings and droplets,
                                      wind spirals and streaks), a camera push-in and shake, a white hit flash, a damage number, and embers when a card falls.
     Turn each layer on and off to compare against today's plain DOM lunge. Tap one of YOUR cards (bottom), then one of THEIR cards (top), or press Attack.
     In the game these would be ONE WebGL canvas (the battle already has #bfxCanvas); two are used here only so the stage can sit under the cards.
     Particles come from the game's own js/pixi-particles.js. -->
<style>
:root { --bg: #12161b; --ink: #e8eef2; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; overscroll-behavior: none; touch-action: manipulation; }
body.flat { background: radial-gradient(ellipse at 50% 55%, #1c2a33, #10161b 70%); }
canvas.bl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#stage { z-index: 0; } #over { z-index: 10; }
#board { position: fixed; inset: 0; z-index: 5; }
.row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 0 8px; }
#rowFoe { top: calc(70px + env(safe-area-inset-top)); } #rowYou { top: 56%; }
.who { position: absolute; left: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.c { position: relative; width: 22%; max-width: 92px; aspect-ratio: 5 / 7; border-radius: 12px; background: linear-gradient(#2a3540, #1d262e); border: 2px solid var(--f, #888); box-shadow: 0 6px 14px rgba(0, 0, 0, .45), inset 0 0 14px color-mix(in srgb, var(--f, #888) 30%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; will-change: transform; }
.c.sel { outline: 3px solid #fff; outline-offset: 2px; } .c.tgt { outline: 2px dashed #ffd27a; outline-offset: 2px; } .c.dead { visibility: hidden; }
.c .e { font-size: 30px; line-height: 1; } .c .n { font-size: 10px; opacity: .85; text-align: center; padding: 0 4px; }
.c .st { position: absolute; left: 5px; right: 5px; bottom: 4px; display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; }
.c .st .p { color: #ffb15a; } .c .st .g { color: #ff7d92; }
.dmg { position: fixed; z-index: 30; font-weight: 900; font-size: 26px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px var(--f, #f55); pointer-events: none; transform: translate(-50%, -50%); }
#panel { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 20; background: rgba(18, 22, 27, .86); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: 8px 10px; }
.row2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.btn { font: inherit; color: var(--ink); background: #232a31; border: 1px solid rgba(255, 255, 255, .2); border-radius: 8px; padding: 7px 10px; min-height: 36px; flex: 1; }
.btn.on { background: #2f5f57; border-color: #8fc4b8; } .btn.go { background: #7a4a2a; border-color: #e8a867; }
.lbl { font-size: 11px; opacity: .7; width: 100%; }
#hint { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 20; font-size: 11px; opacity: .8; text-align: center; }
#err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; z-index: 40; background: #12161b; }
@media (prefers-reduced-motion: reduce) { .c { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" class="bl"></canvas>
<div id="board"><span class="who" style="top:calc(52px + env(safe-area-inset-top))">Them</span><div class="row" id="rowFoe"></div><span class="who" style="top:calc(56% - 18px)">You</span><div class="row" id="rowYou"></div></div>
<canvas id="over" class="bl"></canvas>
<div id="hint">Tap one of your cards (bottom), then one of theirs (top). Or press Attack.</div>
<div id="panel">
  <div class="lbl">Layers (compare with both off = today's plain lunge)</div>
  <div class="row2"><button class="btn on" id="tStage" type="button">A · Stage</button><button class="btn on" id="tCine" type="button">B · Cinematic</button><button class="btn" id="tBoss" type="button">Boss table</button></div>
  <div class="row2"><button class="btn" id="tTurn" type="button">Turn: You</button><button class="btn go" id="bAtk" type="button">Attack ▶</button><button class="btn" id="bReset" type="button">Reset</button></div>
  <div class="row2" style="margin:0"><span class="lbl" style="width:auto">Intensity</span><input id="inten" type="range" min="0.5" max="1.6" step="0.1" value="1" style="flex:1"></div>
</div>
<div id="err"><div><b>WebGL is not available here.</b><br>This lab needs a browser with WebGL.<br><span id="errMsg"></span></div></div>

<script src="assets/vendor/pixi.min.js"></script>
<script src="js/pixi-particles.js"></script>
<script>
(async () => {
'use strict';
const $ = id => document.getElementById(id), R = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FAM = { grove: { c: 0x7fd36a, css: '#7fd36a', rgb: [0.5, 0.83, 0.42] }, stone: { c: 0xd6bf9a, css: '#d6bf9a', rgb: [0.84, 0.75, 0.6] }, tide: { c: 0x6ec6ff, css: '#6ec6ff', rgb: [0.43, 0.78, 1] }, wind: { c: 0xd8ecff, css: '#d8ecff', rgb: [0.85, 0.92, 1] } };
const DECK = {
  foe: [{ n: 'Briar King', e: '👑', f: 'grove', p: 4, g: 7 }, { n: 'Stone Hound', e: '🐺', f: 'stone', p: 5, g: 6 }, { n: 'Tide Eel', e: '🐟', f: 'tide', p: 3, g: 5 }, { n: 'Gale Hawk', e: '🦅', f: 'wind', p: 4, g: 4 }],
  you: [{ n: 'Moss Fox', e: '🦊', f: 'grove', p: 4, g: 5 }, { n: 'Cairn Bear', e: '🐻', f: 'stone', p: 5, g: 7 }, { n: 'Reef Seal', e: '🦭', f: 'tide', p: 3, g: 6 }, { n: 'Dusk Owl', e: '🦉', f: 'wind', p: 4, g: 4 }]
};
const S = { stage: true, cine: true, boss: false, turn: 0, turnV: 0, tint: [0.43, 0.78, 1], tintTo: [0.43, 0.78, 1], hit: [0.5, 0.5], hitT: 9, inten: 1, busy: false, sel: null, cards: { foe: [], you: [] } };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- the two Pixi canvases ---------------- */
let stageApp, overApp;
try {
  const opts = { resizeTo: window, antialias: false, resolution: Math.min(devicePixelRatio || 1, 2), autoDensity: true, preference: 'webgl', autoStart: false };
  stageApp = new PIXI.Application(); await stageApp.init({ ...opts, canvas: $('stage'), background: '#10161b' });
  overApp = new PIXI.Application(); await overApp.init({ ...opts, canvas: $('over'), backgroundAlpha: 0 });
} catch (e) { $('err').style.display = 'grid'; $('errMsg').textContent = String(e && e.message || e); return; }
stageApp.ticker.stop(); overApp.ticker.stop();

/* ---------------- A. the stage shader ---------------- */
const VERT = `in vec2 aPosition; out vec2 vTextureCoord; uniform vec4 uInputSize; uniform vec4 uOutputFrame; uniform vec4 uOutputTexture;
void main(void) { vec2 position = aPosition * uOutputFrame.zw + uOutputFrame.xy; position.x = position.x * (2.0 / uOutputTexture.x) - 1.0; position.y = position.y * (2.0 * uOutputTexture.z / uOutputTexture.y) - uOutputTexture.z; gl_Position = vec4(position, 0.0, 1.0); vTextureCoord = aPosition * (uOutputFrame.zw * uInputSize.zw); }`;
const FRAG = `precision highp float; in vec2 vTextureCoord; out vec4 finalColor; uniform sampler2D uTexture;
uniform float uTime; uniform vec2 uRes; uniform float uTurn; uniform float uBoss; uniform vec3 uTint; uniform vec2 uHit; uniform float uHitT;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
void main(void) {
  vec2 uv = vTextureCoord; float asp = uRes.x / uRes.y;
  vec3 col = vec3(0.075, 0.1, 0.125);
  float grain = vnoise(uv * vec2(asp, 1.0) * 90.0) * 0.5 + vnoise(uv * vec2(asp, 1.0) * 14.0 + uTime * 0.02) * 0.5;   // felt
  col += (grain - 0.5) * 0.05;
  float breathe = 0.85 + 0.15 * sin(uTime * 1.4);
  float you = exp(-pow((uv.y - 0.7) * 2.7, 2.0)) * (1.0 - uTurn), foe = exp(-pow((uv.y - 0.24) * 2.7, 2.0)) * uTurn;   // the light pool follows whose turn it is
  col += uTint * (you + foe) * 0.24 * breathe;
  col += vec3(0.05, 0.06, 0.07) * exp(-pow((uv.y - 0.5) * 24.0, 2.0));                                              // the table's centre line
  float vig = smoothstep(0.3, 0.95, length((uv - 0.5) * vec2(1.0, 1.35)));
  vec3 boss = col * vec3(0.55, 0.32, 0.38) + vec3(0.1, 0.0, 0.02) * (1.0 - vig) * (0.7 + 0.3 * sin(uTime * 0.9));      // a boss fight: the table goes dark and crimson
  col = mix(col, boss, uBoss * 0.85);
  col *= 1.0 - vig * (0.42 + 0.3 * uBoss);
  float d = length((uv - uHit) * vec2(asp, 1.0)); float ring = exp(-pow((d - uHitT * 0.8) * 13.0, 2.0)) * exp(-uHitT * 2.4) * step(0.0, uHitT);   // a hit rolls across the table
  col += uTint * ring * 0.4;
  finalColor = vec4(col, 1.0);
}`;
const stageFilter = new PIXI.Filter({ glProgram: PIXI.GlProgram.from({ vertex: VERT, fragment: FRAG, name: 'battle-stage' }), resources: { u: {
  uTime: { value: 0, type: 'f32' }, uRes: { value: [400, 800], type: 'vec2<f32>' }, uTurn: { value: 0, type: 'f32' }, uBoss: { value: 0, type: 'f32' }, uTint: { value: [0.43, 0.78, 1], type: 'vec3<f32>' }, uHit: { value: [0.5, 0.5], type: 'vec2<f32>' }, uHitT: { value: 9, type: 'f32' } } } });
const stageSpr = new PIXI.Sprite(PIXI.Texture.WHITE); stageSpr.filters = [stageFilter]; stageApp.stage.addChild(stageSpr);
const motes = ppMake(stageApp.stage, 60);   // slow motes in the active family's colour, above the shader

/* ---------------- B. the cinematic layer ---------------- */
const fx = ppMake(overApp.stage, 600);
let frozen = false, last = performance.now(), bossU = 0, moteAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const w = innerWidth, h = innerHeight; stageSpr.width = w; stageSpr.height = h;
  // ease the stage toward where it should be
  S.turnV += (S.turn - S.turnV) * Math.min(1, dt * 3.2); bossU += ((S.boss ? 1 : 0) - bossU) * Math.min(1, dt * 2.5);
  for (let i = 0; i < 3; i++) S.tint[i] += (S.tintTo[i] - S.tint[i]) * Math.min(1, dt * 3);
  S.hitT += dt;
  if (S.stage) {
    const u = stageFilter.resources.u.uniforms; u.uTime = now / 1000; u.uRes = [w, h]; u.uTurn = S.turnV; u.uBoss = bossU; u.uTint = S.tint; u.uHit = S.hit; u.uHitT = S.hitT;
    if (!REDUCE && now > moteAt) { moteAt = now + 260; const c = (Math.round(S.tint[0] * 255) << 16) | (Math.round(S.tint[1] * 255) << 8) | Math.round(S.tint[2] * 255); ppEmit(motes, { tex: 'glow', tint: c, x: R(0, w), y: h + 10, vx: R(-6, 6), vy: R(-26, -44), drag: 1, life: R(5, 8), s0: R(5, 9), s1: R(5, 9), a: 0.35, bell: true, grow: 'lin', sway: { amp: 14, freq: 1.2 } }); }
    ppStep(motes, dt); stageApp.render();
  }
  if (!frozen) ppStep(fx, dt);
  overApp.render();
  requestAnimationFrame(frame);
}
function syncVisibility() { $('stage').style.display = S.stage ? '' : 'none'; document.body.classList.toggle('flat', !S.stage); }

/* ---------------- the cards (plain DOM, like the game) ---------------- */
function build() {
  S.cards = { foe: DECK.foe.map(c => ({ ...c, hp: c.g })), you: DECK.you.map(c => ({ ...c, hp: c.g })) };
  ['foe', 'you'].forEach(side => { const row = $(side === 'foe' ? 'rowFoe' : 'rowYou'); row.innerHTML = '';
    S.cards[side].forEach((c, i) => { const el = document.createElement('div'); el.className = 'c'; el.style.setProperty('--f', FAM[c.f].css); el.dataset.side = side; el.dataset.i = i; c.el = el;
      el.innerHTML = `<span class="e">${c.e}</span><span class="n">${c.n}</span><span class="st"><span class="p">⚔${c.p}</span><span class="g">♥<b>${c.hp}</b></span></span>`; row.appendChild(el); }); });
  S.sel = null;
}
const center = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; };
const settle = (...anims) => Promise.all(anims.map(a => a.finished.catch(() => {})));
const E = { out: 'cubic-bezier(.2,.8,.2,1)', in: 'cubic-bezier(.6,0,.9,.4)' };
function tweenFrames(ms, fn) { return new Promise(res => { const t0 = performance.now(); const step = now => { const u = Math.min(1, (now - t0) / ms); fn(u); if (u < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }

// the family bursts: each is a different shape of motion, not just a different colour
function burst(fam, x, y, k) {
  const c = FAM[fam].c, n = n0 => Math.round(n0 * k);
  if (fam === 'grove') for (let i = 0; i < n(20); i++) { const a = R(0, 6.28), v = R(90, 300); ppEmit(fx, { tex: 'leaf', add: false, tint: pick([0x7fd36a, 0x9fe27c, 0x4fa84a, 0xc6f08f]), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, ay: 140, drag: 0.25, life: R(0.7, 1.3), s0: R(12, 22), s1: 8, rot: R(0, 6.28), vr: R(-9, 9), a: 0.95, grow: 'lin' }); }
  else if (fam === 'stone') {
    ppEmit(fx, { tex: 'ring', tint: 0xe9d9bb, x, y, life: 0.5, s0: 20, s1: 190 * k, a: 0.8, drag: 1 });
    for (let i = 0; i < n(16); i++) { const a = R(0, 6.28), v = R(120, 340); ppEmit(fx, { tex: 'rect', add: false, tint: pick([0x8d7f6d, 0xb3a28a, 0x6d6354]), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, ay: 620, drag: 0.35, life: R(0.5, 0.95), s0: R(8, 14), s1: R(8, 14), w: R(0.5, 1), h: R(0.7, 1.4), rot: R(0, 6.28), vr: R(-12, 12), a: 1, grow: 'lin' }); }
    for (let i = 0; i < n(10); i++) ppEmit(fx, { tex: 'glow', add: false, tint: 0xbfb19a, x: x + R(-24, 24), y: y + R(-10, 20), vx: R(-40, 40), vy: R(-30, -8), drag: 0.4, life: R(0.7, 1.2), s0: R(24, 40), s1: R(46, 70), a: 0.35 });
  } else if (fam === 'tide') {
    for (let r = 0; r < 3; r++) ppEmit(fx, { tex: 'ring', tint: c, x, y, life: 0.55 + r * 0.18, s0: 10, s1: (110 + r * 55) * k, a: 0.85 - r * 0.2, drag: 1 });
    for (let i = 0; i < n(18); i++) { const a = R(-2.6, -0.5), v = R(140, 340); ppEmit(fx, { tex: 'glow', tint: pick([0x6ec6ff, 0xbfe6ff, 0xffffff]), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ay: 700, drag: 0.4, life: R(0.5, 1), s0: R(8, 14), s1: 3 }); }
  } else for (let i = 0; i < n(26); i++) {                       // wind: particles that spiral out, and long streaks along the swirl
    const a0 = i / n(26) * 6.28, v = R(80, 240), sp = i % 2 ? 1 : -1;
    ppEmit(fx, { tex: i % 3 ? 'glow' : 'ray', tint: pick([0xd8ecff, 0xffffff, 0xb6dcff]), x, y, vx: Math.cos(a0) * v, vy: Math.sin(a0) * v, drag: 0.2, life: R(0.5, 0.9), s0: i % 3 ? R(8, 14) : R(60, 110), s1: i % 3 ? 3 : R(70, 130), rot: a0 + sp * 1.2, vr: sp * R(3, 7), a: 0.8 });
  }
  ppEmit(fx, { tex: 'glow', tint: c, x, y, life: 0.3, s0: 40, s1: 150 * k, a: 0.85, drag: 1 });
}
function number(x, y, text, fam) { const d = document.createElement('div'); d.className = 'dmg'; d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.setProperty('--f', FAM[fam].css); document.body.appendChild(d);
  d.animate([{ transform: 'translate(-50%,-30%) scale(.4)', opacity: 0 }, { transform: 'translate(-50%,-90%) scale(1.25)', opacity: 1, offset: .25 }, { transform: 'translate(-50%,-190%) scale(1)', opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => d.remove(); }

/* ---------------- an attack, in beats ---------------- */
async function attack(aSide, ai, di) {
  if (S.busy) return; const dSide = aSide === 'you' ? 'foe' : 'you', A = S.cards[aSide][ai], D = S.cards[dSide][di]; if (!A || !D || A.hp <= 0 || D.hp <= 0) return;
  S.busy = true; S.turn = aSide === 'you' ? 0 : 1; S.tintTo = FAM[A.f].rgb.slice(); clearSel();
  const k = S.inten, a = center(A.el), d = center(D.el), dx = d.x - a.x, dy = d.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len, cine = S.cine && !REDUCE;
  A.el.style.zIndex = 6;
  let held = [];
  if (cine) {
    // 1. wind-up: the card lifts and rocks back while energy gathers on it
    const up = A.el.animate([{ transform: 'none' }, { transform: `translate(${-ux * 12}px, ${-uy * 12 - 8}px) scale(1.08)` }], { duration: 200 * 1, easing: E.out, fill: 'forwards' });
    const t = tweenFrames(200, u => { if (Math.random() < 0.7) { const g = R(0, 6.28), r = 70 * (1 - u) + 10; ppEmit(fx, { tex: 'glow', tint: FAM[A.f].c, x: a.x + Math.cos(g) * r, y: a.y + Math.sin(g) * r, vx: -Math.cos(g) * r * 3, vy: -Math.sin(g) * r * 3, drag: 1, life: 0.2, s0: R(7, 12), s1: 2, a: 0.9 }); } });
    await Promise.all([settle(up), t]);
    // 2. the lunge, with a comet trail along a slight curve
    const nx = -uy, ny = ux, bend = R(-30, 30);
    const lunge = A.el.animate([{ transform: `translate(${-ux * 12}px, ${-uy * 12 - 8}px) scale(1.08)` }, { transform: `translate(${dx * 0.86}px, ${dy * 0.86}px) scale(1.12)` }], { duration: 190, easing: E.in, fill: 'forwards' });
    await Promise.all([settle(lunge), tweenFrames(190, u => {
      const e = u * u, x = a.x + dx * e * 0.86 + nx * bend * Math.sin(u * Math.PI), y = a.y + dy * e * 0.86 + ny * bend * Math.sin(u * Math.PI);
      for (let i = 0; i < 4; i++) ppEmit(fx, { tex: 'glow', tint: i % 2 ? FAM[A.f].c : 0xffffff, x: x + R(-5, 5), y: y + R(-5, 5), life: R(0.25, 0.45), s0: R(20, 30) * k, s1: 2, a: 0.8, drag: 1 });
    })]);
    // 3. hit-stop: everything holds for a beat, then the impact
    frozen = true; held = board().getAnimations({ subtree: true }).filter(an => an.playState === 'running'); held.forEach(an => an.pause());
    ppEmit(fx, { tex: 'rect', tint: 0xffffff, x: d.x, y: d.y, s0: 64, s1: 64 * 1.08, w: d.w * 1.12 / 48, h: d.h * 1.12 / 48, life: 0.2, a: 0.8, drag: 1 });
    burst(A.f, d.x, d.y, k); S.hit = [d.x / innerWidth, d.y / innerHeight]; S.hitT = 0;
    await sleep(90 * k);
    frozen = false; held.forEach(an => an.play());
  } else {
    const lunge = A.el.animate([{ transform: 'none' }, { transform: `translate(${dx * 0.86}px, ${dy * 0.86}px)` }], { duration: 220, easing: E.in, fill: 'forwards' }); await settle(lunge);
    S.hit = [d.x / innerWidth, d.y / innerHeight]; S.hitT = 0;
  }
  // 4. the damage lands: recoil, shake, push-in, number
  const dmg = A.p; D.hp = Math.max(0, D.hp - dmg); D.el.querySelector('.g b').textContent = D.hp; number(d.x, d.y, '-' + dmg, A.f);
  const rec = D.el.animate([{ transform: 'none' }, { transform: `translate(${ux * 10}px, ${uy * 10}px) rotate(${R(-4, 4)}deg)`, offset: 0.3 }, { transform: 'none' }], { duration: 320, easing: 'ease-out' });
  const bd = board(); bd.style.transformOrigin = `${d.x}px ${d.y}px`;
  const shake = A.f === 'stone' ? 9 : 4;

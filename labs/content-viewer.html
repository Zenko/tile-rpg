<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="../">   <!-- labs/ pages resolve every path from the repo root -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Viewer</title>
<!-- A tool, not part of the game (build 330): every word the game says, read from content/ and js/game-config.js exactly as the game
     builds it (names and pronouns filled in, the chosen skin applied), with search and checks. Nothing here changes a file.
     The list of tables comes from labs/content-index.js, which scripts/check.py rewrites, so a new table shows up on its own. -->
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f2ea; --panel: #fffdf8; --line: #e3dccd; --ink: #3d3b36; --soft: #77736a; --accent: #a8741d; --on-accent: #fff;
  --bad: #c2413b; --bad-bg: #fbe4e1; --warn: #9a6a00; --warn-bg: #fdf0cf; --info: #2f6f8f; --info-bg: #dcedf5; --slot-bg: #efe2c4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14181d; --panel: #1d232a; --line: #2e3740; --ink: #e7ebef; --soft: #9aa5af; --accent: #e8cb88; --on-accent: #2b2008;
          --bad: #ff8d84; --bad-bg: #44201e; --warn: #f2c25b; --warn-bg: #3d3115; --info: #8ccbe8; --info-bg: #1b3340; --slot-bg: #4a3d1f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Nunito, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
h1 { margin: 0 0 2px; font-size: 1.15rem; }
.sub { margin: 0 0 10px; color: var(--soft); font-size: .85rem; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type=search], select { font: inherit; font-size: .9rem; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); min-width: 0; }
input[type=search] { flex: 1 1 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font: inherit; font-size: .8rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip b { font-weight: 800; opacity: .75; margin-left: 4px; }
main { padding: 12px 16px 40px; max-width: 980px; }
.file { margin: 18px 0 6px; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--soft); }
.row { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin: 6px 0; }
.path { font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--soft); word-break: break-all; }
.text { margin: 3px 0 0; white-space: pre-wrap; word-break: break-word; }
.slot { background: var(--slot-bg); border-radius: 4px; padding: 0 3px; font-family: ui-monospace, Menlo, monospace; font-size: .88em; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tag { font-size: .7rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.tag.bad { background: var(--bad-bg); color: var(--bad); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.info { background: var(--info-bg); color: var(--info); }
.empty { color: var(--soft); padding: 30px 0; text-align: center; }
.more { font: inherit; font-weight: 700; margin: 12px 0; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.skin-pill { display: none !important; }
</style>
</head>
<body>
<script src="js/game-config.js"></script>
<script>loadSkin();</script>
<script src="content/cards.js"></script>
<script src="content/world.js"></script>
<script src="content/items.js"></script>
<script src="content/dialogue.js"></script>
<script src="content/story.js"></script>
<script src="content/guide.js"></script>
<script src="content/text.js"></script>
<script>applySkinContent();</script>
<script src="labs/content-index.js"></script>

<header>
  <h1>Content Viewer</h1>
  <p class="sub" id="sub"></p>
  <div class="bar">
    <input type="search" id="q" placeholder="Search words, names or paths…" aria-label="Search">
    <select id="file" aria-label="File"></select>
    <select id="skin" aria-label="Skin"></select>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>

<script>
/* Walks every table named in CONTENT_INDEX and collects each piece of text with where it lives (file, table, path).
   Only words are kept: a string with a space in it, or one under a key that names something (name, title, ...). Ids, icons
   and colours are skipped. Functions (rules like `done: p => ...`) are not words and are skipped too. */
const NAME_KEYS = new Set(['name', 'title', 'label', 'subject', 'from', 'who', 'unit', 'boss', 'one', 'many', 'tagline', 'ask', 'goal', 'heading']);
const CHECKS = [
  { id: 'broken', cls: 'bad',  label: 'Broken',   test: t => /\bundefined\b|\bNaN\b|\[object |\bnull\b/.test(t), why: 'undefined / NaN / null in the words: a ${...} that points at nothing' },
  { id: 'long',   cls: 'warn', label: 'Long',     test: t => t.length > 200, why: 'over 200 characters: may not fit a phone bubble' },
  { id: 'space',  cls: 'warn', label: 'Spacing',  test: t => /\S {2,}\S| [,.;:](?![\d.])|^\s|\s$/.test(t), why: 'double space, a space before punctuation, or a space at either end' },
  { id: 'slot',   cls: 'info', label: 'Slots',    test: t => /\{\w+\}/.test(t), why: 'has {slots} the code fills in' },
  { id: 'es',     cls: 'info', label: 'Spanish',  test: t => /[ñáéíóú¿¡]/i.test(t), why: 'has Spanish letters: useful to spot mixed languages' },
];
const rows = [];
function walk(v, path, key, file, depth) {
  if (depth > 8 || v == null) return;
  if (typeof v === 'string') {
    if (/[A-Za-zÀ-ÿ]/.test(v) && (/\s/.test(v.trim()) || NAME_KEYS.has(key))) rows.push({ file, path, text: v });
    return;
  }
  if (typeof v !== 'object') return;
  if (Array.isArray(v)) v.forEach((x, i) => walk(x, `${path}[${i}]`, key, file, depth + 1));
  else Object.keys(v).forEach(k => walk(v[k], /^[A-Za-z_$][\w$]*$/.test(k) ? `${path}.${k}` : `${path}['${k}']`, k, file, depth + 1));
}
const roots = { 'js/game-config.js': ['GAME', 'PLACES', 'BOSSES', 'FAMILY_NAMES', 'CAST'] };
Object.assign(roots, CONTENT_INDEX);
Object.keys(roots).forEach(file => roots[file].forEach(name => {
  let v; try { v = (0, eval)(name); } catch (e) { return; }
  walk(v, name, '', file, 0);
}));
rows.forEach(r => { r.flags = CHECKS.filter(c => c.test(r.text)).map(c => c.id); r.hay = (r.path + ' ' + r.text).toLowerCase(); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ui = { q: '', file: '', flag: '', limit: 400 };
const $ = id => document.getElementById(id);

$('sub').textContent = `${rows.length} pieces of text from ${Object.keys(roots).length} files` + (SKIN_ON ? ` · skin: ${SKIN_DEF.title || SKIN_ON}` : ' · the real game (no skin)');
$('file').innerHTML = '<option value="">All files</option>' + Object.keys(roots).map(f => `<option>${esc(f)}</option>`).join('');
$('skin').innerHTML = '<option value="">No skin</option>' + SKINS.map(s => `<option value="${esc(s)}"${s === SKIN_ON ? ' selected' : ''}>Skin: ${esc(s)}</option>`).join('');
$('skin').onchange = e => { location.search = '?skin=' + encodeURIComponent(e.target.value); };
$('q').oninput = e => { ui.q = e.target.value.trim().toLowerCase(); ui.limit = 400; render(); };
$('file').onchange = e => { ui.file = e.target.value; ui.limit = 400; render(); };

function chips() {
  const n = id => rows.filter(r => r.flags.includes(id)).length;
  $('chips').innerHTML = [`<button class="chip" data-f="" aria-pressed="${!ui.flag}">Everything<b>${rows.length}</b></button>`]
    .concat(CHECKS.map(c => `<button class="chip" data-f="${c.id}" title="${esc(c.why)}" aria-pressed="${ui.flag === c.id}">${c.label}<b>${n(c.id)}</b></button>`)).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { ui.flag = b.dataset.f; ui.limit = 400; chips(); render(); });
}
function render() {
  const words = ui.q.split(/\s+/).filter(Boolean);
  const hit = rows.filter(r => (!ui.file || r.file === ui.file) && (!ui.flag || r.flags.includes(ui.flag)) && words.every(w => r.hay.includes(w)));
  let html = '', last = '';
  hit.slice(0, ui.limit).forEach(r => {
    if (r.file !== last) { html += `<div class="file">${esc(r.file)}</div>`; last = r.file; }
    const text = esc(r.text).replace(/\{(\w+)\}/g, '<span class="slot">{$1}</span>');
    const tags = r.flags.map(id => { const c = CHECKS.find(x => x.id === id); return `<span class="tag ${c.cls}" title="${esc(c.why)}">${c.label}</span>`; }).join('');
    html += `<div class="row"><div class="path">${esc(r.path)}</div><p class="text">${text}</p>${tags ? `<div class="tags">${tags}</div>` : ''}</div>`;
  });
  if (!hit.length) html = '<p class="empty">Nothing matches.</p>';
  else if (hit.length > ui.limit) html += `<button class="more" id="more">Show more (${hit.length - ui.limit} left)</button>`;
  $('list').innerHTML = html;
  const m = $('more'); if (m) m.onclick = () => { ui.limit += 400; render(); };
}
chips(); render();
</script>
</body>

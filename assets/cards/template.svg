<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Tile RPG card art template, 512 x 512</title>
  <!-- Import into Figma, draw inside the "ART" group, and delete or hide the "GUIDES" group before exporting 1x PNG. -->
  <g id="GUIDES" fill="none" stroke-width="2">
    <rect x="1" y="1" width="510" height="510" stroke="#8a97a3" stroke-dasharray="6 6"/>                        <!-- canvas edge -->
    <rect x="51" y="51" width="410" height="410" rx="24" stroke="#3f9f8f"/>                                      <!-- safe area, 80% -->
    <circle cx="256" cy="256" r="205" stroke="#c98b3c" stroke-dasharray="3 7"/>                                   <!-- round subjects sit inside this -->
    <path d="M256 0V512M0 256H512" stroke="#8a97a3" stroke-opacity=".45" stroke-dasharray="2 8"/>
    <path d="M64 448H448" stroke="#b86c8c" stroke-opacity=".8"/>                                                  <!-- ground line for standing creatures -->
    <text x="60" y="44" font-family="sans-serif" font-size="14" fill="#3f9f8f" stroke="none">safe area 410 x 410 (keep the subject inside)</text>
    <text x="60" y="440" font-family="sans-serif" font-size="12" fill="#b86c8c" stroke="none">ground line</text>
  </g>
  <g id="ART"></g>
</svg>

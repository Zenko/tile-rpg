<svg xmlns="http://www.w3.org/2000/svg" width="780" height="790" viewBox="0 0 780 790" font-family="Arial, sans-serif">
  <title>Town palette swatches for drawing town sprites. Reference only - not a sprite.</title>
  <rect width="780" height="790" fill="#1f2a1f"/>
    <text x="24" y="40" font-size="22" font-weight="700" fill="#e8e2d4">Town palette (Town Square / meadow, dark)</text>
  <text x="24" y="64" font-size="12" fill="#b9b2a2">Draw with these exact hex values. The converter turns each into its theme variable, so the sprite recolours itself per district and for light mode.</text>
